name: Update Market History

on:
  # 수동 실행 가능
  workflow_dispatch:

  # 평일 한국시간 18:30 자동 실행
  # GitHub Actions cron은 UTC 기준
  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update-market-history:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. KRX 데이터 수집
      - name: Update market history
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: node scripts/update-market-history.js

      # 4. 생성된 history 파일 확인
      - name: Check history file
        run: |
          if [ ! -f "data/market-history.json" ]; then
            echo "ERROR: data/market-history.json was not created"
            exit 1
          fi

          echo "market-history.json created successfully"
          ls -lh data/market-history.json

      # 5. 변경된 history를 GitHub에 자동 저장
      - name: Commit market history
        run: |
          git config user.name "leader-cycle-bot"
          git config user.email "leader-cycle-bot@users.noreply.github.com"

          git add data/market-history.json

          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi

          git commit -m "Update market history"

          git pull --rebase origin main
          git push origin main

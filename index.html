<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>LEADER CYCLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --bg2: #0c1425;
      --panel: #11161f;
      --panel2: #171d27;
      --line: #283142;

      --text: #f5f7fa;
      --muted: #8d97a8;

      --red: #ff5b6d;
      --green: #42d98b;
      --blue: #5d8cff;
      --yellow: #ffd166;
      --orange: #ff9f43;
      --purple: #a778ff;

      --exit: #ff4968;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(93, 140, 255, .12),
          transparent 35%
        ),
        var(--bg2);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;

      padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 26px;
    }

    .brand {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--blue);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1.6px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .badge.live {
      color: var(--green);
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 24px 0 30px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }

    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      font-size: 25px;
      font-weight: 900;
      margin-top: 6px;
    }

    section {
      margin-top: 36px;
      scroll-margin-top: 20px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -.8px;
    }

    .section-desc {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    /* =====================================================
       ACTION BOARD
    ===================================================== */

    .action-board-wrap {
      margin-top: 30px;
    }

    .action-board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .action-board-card {
      border-radius: 17px;
      padding: 15px;
      border: 1px solid var(--line);
      background: var(--panel);
      cursor: pointer;
      transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action-board-card:active {
      transform: scale(.98);
    }

    .action-board-card.BUY_ZONE {
      border-color: rgba(66,217,139,.35);
      background:
        linear-gradient(
          135deg,
          rgba(66,217,139,.12),
          transparent 70%
        ),
        var(--panel);
    }

    .action-board-card.PULLBACK_BUY {
      border-color: rgba(93,140,255,.35);
      background:
        linear-gradient(
          135deg,
          rgba(93,140,255,.12),
          transparent 70%
        ),
        var(--panel);
    }

    .action-board-card.HOLD {
      border-color: rgba(255,209,102,.25);
    }

    .action-board-card.NO_CHASE {
      border-color: rgba(255,159,67,.3);
    }

    .action-board-card.REDUCE,
    .action-board-card.EXIT {
      border-color: rgba(255,91,109,.28);
    }

    .action-board-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .action-board-value {
      margin-top: 5px;
      font-size: 28px;
      font-weight: 950;
    }

    .action-board-card.BUY_ZONE
    .action-board-value {
      color: var(--green);
    }

    .action-board-card.PULLBACK_BUY
    .action-board-value {
      color: var(--blue);
    }

    .action-board-card.HOLD
    .action-board-value {
      color: var(--yellow);
    }

    .action-board-card.NO_CHASE
    .action-board-value {
      color: var(--orange);
    }

    .action-board-card.REDUCE
    .action-board-value,
    .action-board-card.EXIT
    .action-board-value {
      color: var(--red);
    }

    .action-board-hint {
      color: #647086;
      font-size: 10px;
      margin-top: 9px;
    }

    /* =====================================================
       SECTOR
    ===================================================== */

    .sector-list,
    .stock-list {
      display: grid;
      gap: 14px;
    }

    .sector-card,
    .stock-card {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 17px;
    }

    .sector-top,
    .stock-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .rank {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sector-name,
    .stock-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .stock-code {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .stage {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stage.EARLY {
      color: var(--green);
      background: rgba(66,217,139,.12);
    }

    .stage.LEADERSHIP_ENTRY {
      color: var(--blue);
      background: rgba(93,140,255,.14);
    }

    .stage.EXPANSION {
      color: var(--red);
      background: rgba(255,91,109,.13);
    }

    .stage.PEAK {
      color: var(--yellow);
      background: rgba(255,209,102,.13);
    }

    .stage.EXHAUSTION {
      color: var(--orange);
      background: rgba(255,159,67,.13);
    }

    .stage.EXIT {
      color: #ff4968;
      background: rgba(255,73,104,.13);
    }

    .stage.WATCH {
      color: var(--muted);
      background: rgba(141,151,168,.1);
    }

    .cycle {
      margin-top: 15px;
      padding: 13px;
      border-radius: 14px;
      background: var(--panel2);
    }

    .cycle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .cycle-label {
      font-weight: 850;
      font-size: 13px;
    }

    .cycle-progress {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      margin-top: 10px;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: #0b0f16;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--blue),
          var(--red),
          var(--orange)
        );
    }

    .cycle-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .score-box {
      background: var(--panel2);
      padding: 12px;
      border-radius: 14px;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .score-value {
      margin-top: 4px;
      font-size: 23px;
      font-weight: 900;
    }

    .han {
      color: var(--red);
    }

    .early {
      color: var(--green);
    }

    .exhaust {
      color: var(--orange);
    }

    .metrics {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin-top: 13px;
    }

    .leaders {
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }

    .leaders-title {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .leader-row + .leader-row {
      border-top: 1px solid rgba(255,255,255,.04);
    }

    .leader-name {
      font-size: 14px;
      font-weight: 800;
    }

    .leader-code {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .rate {
      font-size: 14px;
      font-weight: 900;
    }

    .up {
      color: var(--red) !important;
    }

    .down {
      color: var(--blue) !important;
    }

    /* =====================================================
       ACTION STOCK CARD
    ===================================================== */

    .action-banner {
      margin-bottom: 16px;
      border-radius: 17px;
      padding: 14px;
      border: 1px solid var(--line);
    }

    .action-banner.BUY_ZONE {
      background: rgba(66,217,139,.09);
      border-color: rgba(66,217,139,.3);
    }

    .action-banner.PULLBACK_BUY {
      background: rgba(93,140,255,.09);
      border-color: rgba(93,140,255,.3);
    }

    .action-banner.HOLD {
      background: rgba(255,209,102,.07);
      border-color: rgba(255,209,102,.22);
    }

    .action-banner.NO_CHASE {
      background: rgba(255,159,67,.08);
      border-color: rgba(255,159,67,.28);
    }

    .action-banner.REDUCE,
    .action-banner.EXIT {
      background: rgba(255,91,109,.08);
      border-color: rgba(255,91,109,.27);
    }

    .action-banner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .action-main-label {
      font-size: 17px;
      font-weight: 950;
      letter-spacing: -.3px;
    }

    .action-confidence {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .action-confidence strong {
      color: var(--text);
      font-size: 15px;
    }

    .confidence-track {
      height: 5px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.07);
      margin-top: 10px;
    }

    .confidence-bar {
      height: 100%;
      border-radius: inherit;
    }

    .BUY_ZONE .confidence-bar {
      background: var(--green);
    }

    .PULLBACK_BUY .confidence-bar {
      background: var(--blue);
    }

    .HOLD .confidence-bar {
      background: var(--yellow);
    }

    .NO_CHASE .confidence-bar {
      background: var(--orange);
    }

    .REDUCE .confidence-bar,
    .EXIT .confidence-bar {
      background: var(--red);
    }

    .reason-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 11px;
    }

    .reason-chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      color: #c9d0da;
      font-size: 10px;
      font-weight: 750;
    }

    .entry-score {
      text-align: right;
    }

    .entry-score-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .entry-score-value {
      color: var(--blue);
      font-size: 35px;
      font-weight: 950;
      line-height: 1;
      margin-top: 5px;
    }

    .price-line {
      display: flex;
      gap: 10px;
      align-items: baseline;
      margin-top: 17px;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
    }

    .change {
      font-size: 18px;
      font-weight: 900;
    }

    /* =====================================================
       PRICE PLAN
    ===================================================== */

    .price-plan {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .price-plan-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      background: var(--panel2);
      border-radius: 13px;
    }

    .price-plan-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .price-plan-value {
      font-size: 13px;
      font-weight: 900;
      text-align: right;
    }

    .price-plan-row.buy .price-plan-value {
      color: var(--green);
    }

    .price-plan-row.chase .price-plan-value {
      color: var(--orange);
    }

    .price-plan-row.stop .price-plan-value {
      color: var(--red);
    }

    .risk-pill {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
    }

    .risk-LOW {
      color: var(--green);
      background: rgba(66,217,139,.1);
    }

    .risk-NORMAL {
      color: var(--blue);
      background: rgba(93,140,255,.1);
    }

    .risk-HIGH {
      color: var(--orange);
      background: rgba(255,159,67,.1);
    }

    .risk-EXTREME {
      color: var(--red);
      background: rgba(255,91,109,.1);
    }

    .alignment {
      margin-top: 14px;
      padding: 13px;
      border-radius: 14px;
      background: var(--panel2);

      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .alignment-title {
      color: var(--muted);
      font-size: 12px;
    }

    .alignment-value {
      font-size: 13px;
      font-weight: 900;
    }

    .alignment-value.PERFECT {
      color: var(--green);
    }

    .alignment-value.BULLISH {
      color: #72e6a8;
    }

    .alignment-value.FORMING {
      color: var(--yellow);
    }

    .alignment-value.MIXED {
      color: var(--orange);
    }

    .alignment-value.BROKEN {
      color: var(--red);
    }

    .stock-score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 13px;
    }

    .stock-score {
      text-align: center;
      background: var(--panel2);
      border-radius: 13px;
      padding: 11px 4px;
    }

    .stock-score span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .stock-score strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 13px;
    }

    .indicator {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel2);
      padding: 11px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .indicator strong {
      color: var(--text);
    }

    /* =====================================================
       CHART
    ===================================================== */

    .chart-box {
      margin-top: 14px;
      background: #090d13;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 17px;
      padding: 12px;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .chart-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      font-size: 9px;
      font-weight: 900;
    }

    .legend .price-l {
      color: #fff;
    }

    .legend .ma5 {
      color: var(--yellow);
    }

    .legend .ma10 {
      color: var(--blue);
    }

    .legend .ma20 {
      color: var(--green);
    }

    .legend .ma40 {
      color: var(--purple);
    }

    canvas {
      width: 100%;
      height: 190px;
      display: block;
    }

    .chart-dates {
      display: flex;
      justify-content: space-between;
      color: #596579;
      font-size: 10px;
      margin-top: 3px;
    }

    .foot-note {
      color: #647086;
      font-size: 11px;
      margin-top: 13px;
    }

    /* =====================================================
       ACTION LIST FILTER
    ===================================================== */

    .action-filter {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 14px;
      padding-bottom: 3px;
    }

    .action-filter::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
    }

    .filter-btn.active {
      color: var(--text);
      border-color: var(--blue);
      background: rgba(93,140,255,.12);
    }

    .empty-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: rgba(255,91,109,.08);
      border: 1px solid rgba(255,91,109,.25);
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
    }

    footer {
      color: #566174;
      text-align: center;
      font-size: 10px;
      margin-top: 45px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 31px;
      }

      .sector-name,
      .stock-name {
        font-size: 21px;
      }

      .entry-score-value {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      LEADER CYCLE
    </div>

    <h1>
      시장 주도주 레이더
    </h1>

    <div class="subtitle">
      시장 → 섹터 사이클 → 주도 종목 → 매수·보유·매도 타이밍을 추적합니다.
    </div>

    <div id="status" class="status"></div>
  </header>

  <div class="nav">
    <a href="#action">🎯 오늘의 액션</a>
    <a href="#leaders">🔥 주도섹터</a>
    <a href="#early">🌱 차기섹터</a>
    <a href="#exhaustion">⚠️ 종료위험</a>
    <a href="#stocks">📈 종목</a>
  </div>

  <div id="app">
    <div class="loading">
      시장 데이터 분석 중...
    </div>
  </div>

  <footer>
    LEADER CYCLE · KRX MARKET DATA · 투자 판단 보조용
  </footer>

</div>


<script>

const SECTOR_API =
  "/api/sector-scan";

const RANKING_API =
  "/api/rankings";

let CURRENT_RANKING_DATA = null;
let CURRENT_STOCKS = [];
let CURRENT_FILTER = "ALL";


/* =========================================================
   HELPERS
========================================================= */

function num(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}


function formatRate(value) {
  const n = num(value);

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}


function formatPrice(value) {
  const n = num(value);

  if (n <= 0) {
    return "-";
  }

  return Math.round(n)
    .toLocaleString() + "원";
}


function formatMoney(value) {
  const n = num(value);

  if (n >= 1e12) {
    return (
      n / 1e12
    ).toFixed(1) + "조";
  }

  if (n >= 1e8) {
    return (
      n / 1e8
    ).toFixed(0) + "억";
  }

  return Math.round(n)
    .toLocaleString();
}


function rateClass(value) {
  const n = num(value);

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "";
}


function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function stageInfo(sector) {
  const code =
    sector.stageCode ||
    sector.stage ||
    "WATCH";

  const label =
    sector.stageLabel ||
    {
      EARLY:
        "🌱 초기 포착",

      LEADERSHIP_ENTRY:
        "🚀 주도 진입",

      EXPANSION:
        "🔥 주도 확산",

      PEAK:
        "👑 주도 정점",

      EXHAUSTION:
        "⚠️ 소진 경고",

      EXIT:
        "🔻 주도 이탈",

      WATCH:
        "👀 관찰"
    }[code] ||
    code;

  return {
    code,
    label
  };
}

}

function actionInfo(signal) {

  const map = {

    BUY_ZONE: {
      label: "🟢 BUY ZONE",
      short: "🟢 신규매수"
    },

    PULLBACK_BUY: {
      label: "🔵 PULLBACK BUY",
      short: "🔵 눌림매수"
    },

    HOLD: {
      label: "🟡 HOLD",
      short: "🟡 보유"
    },

    NO_CHASE: {
      label: "🟠 NO CHASE",
      short: "🟠 추격금지"
    },

    REDUCE: {
      label: "🔴 REDUCE",
      short: "🔴 축소"
    },

    EXIT: {
      label: "⛔ EXIT",
      short: "⛔ 매도"
    }

  };

  return (
    map[signal] ||
    {
      label: "🟡 HOLD",
      short: "🟡 보유"
    }
  );
}


function alignmentInfo(stock) {
  const raw =
    String(
      stock.alignment || ""
    ).toUpperCase();

  if (raw === "PERFECT") {
    return {
      code: "PERFECT",
      label: "🟢 완전 정배열"
    };
  }

  if (raw === "BULLISH") {
    return {
      code: "BULLISH",
      label: "🟢 정배열"
    };
  }

  if (raw === "FORMING") {
    return {
      code: "FORMING",
      label: "🟡 정배열 형성"
    };
  }

  if (raw === "BROKEN") {
    return {
      code: "BROKEN",
      label: "🔴 추세 붕괴"
    };
  }

  return {
    code: "MIXED",
    label: "🟠 혼조"
  };
}

function actionFilterHTML() {

  const filters = [
    ["ALL", "전체"],
    ["BUY_ZONE", "🟢 신규매수"],
    ["PULLBACK_BUY", "🔵 눌림매수"],

    ["EXIT", "⛔ 매도"]
  ];

  return filters.map(
    ([signal, label]) => `
      <button
        class="filter-btn ${
          CURRENT_FILTER === signal
            ? "active"
            : ""
        }"
        onclick="selectAction('${signal}')"
      >
        ${label}
      </button>
    `
  ).join("");
}


function renderStockList() {

  const container =
    document.getElementById(
      "stock-list-container"
    );

  const filterContainer =
    document.getElementById(
      "action-filter-container"
    );

  const title =
    document.getElementById(
      "stock-section-title"
    );

  const desc =
    document.getElementById(
      "stock-section-desc"
    );

  if (
    !container ||
    !filterContainer
  ) {
    return;
  }

  filterContainer.innerHTML =
    actionFilterHTML();

  let stocks =
    CURRENT_STOCKS;

  if (
    CURRENT_FILTER !== "ALL"
  ) {
    stocks =
      CURRENT_STOCKS.filter(
        stock =>
          stock.action?.signal ===
          CURRENT_FILTER
      );
  }

  const meta =
    actionInfo(
      CURRENT_FILTER
    );

  if (
    CURRENT_FILTER === "ALL"
  ) {
    title.innerHTML =
      "📈 종목 액션 레이더";

    desc.innerHTML =
      "ENTRY 상위 종목 중심";

  } else {
    title.innerHTML =
      meta.short;

    desc.innerHTML =
      `${stocks.length}개 종목`;
  }

  if (!stocks.length) {
    container.innerHTML = `
      <div class="empty-state">
        현재 해당 신호 종목이 없습니다.
      </div>
    `;

    return;
  }

  /*
    ALL = ENTRY 상위 10개

    특정 ACTION 선택 =
    해당 ACTION 종목 최대 20개
  */

  const visible =
    stocks.slice(
      0,
      CURRENT_FILTER === "ALL"
        ? 10
        : 20
    );

  container.innerHTML =
    visible
      .map(stockCardHTML)
      .join("");

  requestAnimationFrame(
    () => {
      drawVisibleCharts(
        visible
      );
    }
  );
}


function selectAction(signal) {

  CURRENT_FILTER =
    signal;

  renderStockList();

  const section =
    document.getElementById(
      "stocks"
    );

  if (section) {
    section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}

/* =========================================================
   CHART
========================================================= */

function drawChart(
  canvas,
  rows
) {
  if (
    !canvas ||
    !Array.isArray(rows) ||
    rows.length < 2
  ) {
    return;
  }

  const dpr =
    window.devicePixelRatio || 1;

  const rect =
    canvas.getBoundingClientRect();

  const width =
    Math.max(
      280,
      rect.width
    );

  const height =
    190;

  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(
    dpr,
    dpr
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const padding = {
    left: 7,
    right: 7,
    top: 10,
    bottom: 10
  };

  const keys = [
    "close",
    "ma5",
    "ma10",
    "ma20",
    "ma40"
  ];

  const values = [];

  for (const row of rows) {
    for (const key of keys) {

      const value =
        num(row[key]);

      if (value > 0) {
        values.push(value);
      }

    }
  }

  if (!values.length) {
    return;
  }

  let min =
    Math.min(...values);

  let max =
    Math.max(...values);

  const range =
    Math.max(
      max - min,
      max * .03,
      1
    );

  min -=
    range * .08;

  max +=
    range * .08;

  const plotWidth =
    width -
    padding.left -
    padding.right;

  const plotHeight =
    height -
    padding.top -
    padding.bottom;


  function x(index) {

    return (
      padding.left +
      (
        index /
        Math.max(
          rows.length - 1,
          1
        )
      ) *
      plotWidth
    );

  }


  function y(value) {

    return (
      padding.top +
      (
        1 -
        (
          value - min
        ) /
        (
          max - min
        )
      ) *
      plotHeight
    );

  }


  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth = 1;


  for (
    let i = 0;
    i < 5;
    i++
  ) {

    const gy =
      padding.top +
      (
        plotHeight /
        4
      ) *
      i;

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      gy
    );

    ctx.lineTo(
      width -
      padding.right,
      gy
    );

    ctx.stroke();
  }


  function drawLine(
    key,
    color,
    lineWidth
  ) {

    ctx.beginPath();

    let started =
      false;


    rows.forEach(
      (row, index) => {

        const value =
          num(row[key]);

        if (value <= 0) {
          return;
        }

        const px =
          x(index);

        const py =
          y(value);


        if (!started) {

          ctx.moveTo(
            px,
            py
          );

          started =
            true;

        } else {

          ctx.lineTo(
            px,
            py
          );

        }

      }
    );


    ctx.strokeStyle =
      color;

    ctx.lineWidth =
      lineWidth;

    ctx.lineJoin =
      "round";

    ctx.lineCap =
      "round";

    ctx.stroke();
  }


  drawLine(
    "ma40",
    "#a778ff",
    2
  );

  drawLine(
    "ma20",
    "#42d98b",
    2
  );

  drawLine(
    "ma10",
    "#5d8cff",
    2
  );

  drawLine(
    "ma5",
    "#ffd166",
    2
  );

  drawLine(
    "close",
    "#f5f7fa",
    3
  );


  const last =
    rows[
      rows.length - 1
    ];


  if (
    last &&
    num(last.close) > 0
  ) {

    ctx.beginPath();

    ctx.arc(
      x(
        rows.length - 1
      ),
      y(
        num(last.close)
      ),
      4,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();
  }
}


function drawVisibleCharts(
  stocks
) {

  if (
    !Array.isArray(stocks)
  ) {
    return;
  }

  stocks.forEach(
    (stock, index) => {

      const canvas =
        document.getElementById(
          `action-chart-${stock.code}-${index}`
        );

      drawChart(
        canvas,
        stock.chart || []
      );

    }
  );
}


/* =========================================================
   SECTOR EXHAUSTION
========================================================= */

function findExhaustionSectors(
  sectorData
) {

  const all =
    Array.isArray(
      sectorData.sectors
    )
      ? sectorData.sectors
      : [];


  return all
    .filter(
      sector => {

        const stage =
          sector.stageCode ||
          sector.stage;

        return (
          stage === "PEAK" ||
          stage === "EXHAUSTION" ||
          stage === "EXIT" ||
          num(
            sector.exhaustion
          ) >= 60
        );

      }
    )
    .sort(
      (a, b) =>
        num(
          b.exhaustion
        ) -
        num(
          a.exhaustion
        )
    )
    .slice(
      0,
      10
    );
}


/* =========================================================
   BUILD MASTER STOCK LIST

   actionBoard에는 각 액션별 배열이 존재하므로
   ENTRY TOP10 외 종목도 필터에서 볼 수 있게 합친다.
========================================================= */

function buildMasterStockList(
  rankingData
) {

  const map =
    new Map();


  function addStocks(list) {

    if (!Array.isArray(list)) {
      return;
    }

    for (const stock of list) {

      if (
        !stock ||
        !stock.code
      ) {
        continue;
      }

      if (
        !map.has(stock.code)
      ) {
        map.set(
          stock.code,
          stock
        );
      }

    }
  }


  addStocks(
    rankingData.entryRanking
  );


  const board =
    rankingData.actionBoard ||
    {};


  addStocks(
    board.buyZone
  );

  addStocks(
    board.pullbackBuy
  );

  addStocks(
    board.hold
  );

  addStocks(
    board.noChase
  );

  addStocks(
    board.reduce
  );

  addStocks(
    board.exit
  );


  return [
    ...map.values()
  ];
}

        fetch(
          RANKING_API,
          {
            cache: "no-store"
          }

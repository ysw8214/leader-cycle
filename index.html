<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>LEADER CYCLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --panel: #11151c;
      --panel2: #171c25;
      --panel3: #1c222d;
      --line: #252d3a;

      --text: #f5f7fa;
      --muted: #8d97a8;
      --muted2: #626d80;

      --red: #ff5c6c;
      --green: #45d98b;
      --blue: #5d8cff;
      --yellow: #ffd166;
      --purple: #aa7cff;
      --orange: #ff9f43;

      --ma5: #ffd166;
      --ma10: #5d8cff;
      --ma20: #45d98b;
      --ma40: #aa7cff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(93,140,255,.12),
          transparent 32%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      padding:
        calc(22px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    /* =====================================================
       HEADER
    ===================================================== */

    header {
      margin-bottom: 26px;
    }

    .brand {
      color: var(--blue);

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 3px;

      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 32px;

      letter-spacing: -1.4px;
    }

    .subtitle {
      margin-top: 9px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      display: flex;
      gap: 8px;

      margin-top: 15px;

      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;

      border-radius: 999px;

      background: var(--panel2);

      border:
        1px solid var(--line);

      color: var(--muted);

      font-size: 12px;
      font-weight: 800;
    }

    .badge.live {
      color: var(--green);
    }

    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      margin-bottom: 28px;
    }

    .summary-card {
      background: var(--panel);

      border:
        1px solid var(--line);

      border-radius: 17px;

      padding: 15px;
    }

    .summary-label {
      color: var(--muted);

      font-size: 11px;
    }

    .summary-value {
      margin-top: 5px;

      font-size: 22px;
      font-weight: 900;
    }

    /* =====================================================
       NAV
    ===================================================== */

    .nav {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding-bottom: 5px;

      margin-bottom: 30px;

      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      flex: 0 0 auto;

      text-decoration: none;

      color: var(--muted);

      background: var(--panel);

      border:
        1px solid var(--line);

      border-radius: 999px;

      padding: 9px 13px;

      font-size: 12px;
      font-weight: 800;
    }

    /* =====================================================
       SECTION
    ===================================================== */

    section {
      margin-top: 36px;
    }

    .section-head {
      display: flex;

      align-items: flex-end;

      justify-content:
        space-between;

      gap: 15px;

      margin-bottom: 14px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;

      letter-spacing: -.5px;
    }

    .section-desc {
      color: var(--muted);

      font-size: 12px;

      text-align: right;
    }

    /* =====================================================
       SECTOR
    ===================================================== */

    .sector-list {
      display: grid;
      gap: 11px;
    }

    .sector {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 19px;

      padding: 16px;
    }

    .sector.exhaust {
      border-color:
        rgba(255,159,67,.32);
    }

    .sector-top {
      display: flex;

      align-items: flex-start;

      justify-content:
        space-between;

      gap: 12px;
    }

    .rank {
      color: var(--muted);

      font-size: 12px;

      margin-bottom: 5px;
    }

    .sector-name {
      font-size: 20px;
      font-weight: 900;
    }

    .stage {
      font-size: 11px;
      font-weight: 900;

      padding: 6px 9px;

      border-radius: 999px;

      background:
        rgba(93,140,255,.12);

      color: var(--blue);
    }

    .stage.LEADER {
      color: var(--red);

      background:
        rgba(255,92,108,.13);
    }

    .stage.STRONG {
      color: var(--red);

      background:
        rgba(255,92,108,.12);
    }

    .stage.EMERGING {
      color: var(--green);

      background:
        rgba(69,217,139,.12);
    }

    .stage.MATURE {
      color: var(--orange);

      background:
        rgba(255,159,67,.12);
    }

    .stage.WEAK {
      color: var(--muted);
    }

    .sector-scores {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;

      margin-top: 14px;
    }

    .sector-score {
      background: var(--panel2);

      border-radius: 12px;

      padding: 10px;
    }

    .sector-score-label {
      color: var(--muted);

      font-size: 10px;
    }

    .sector-score-value {
      margin-top: 4px;

      font-size: 20px;
      font-weight: 900;
    }

    .han {
      color: var(--red);
    }

    .early {
      color: var(--green);
    }

    .exhaustion {
      color: var(--orange);
    }

    .metrics {
      display: flex;

      gap: 13px;

      flex-wrap: wrap;

      margin-top: 13px;

      color: var(--muted);

      font-size: 12px;
    }

    .leaders {
      margin-top: 14px;

      padding-top: 12px;

      border-top:
        1px solid var(--line);
    }

    .leaders-title {
      color: var(--muted);

      font-size: 11px;

      margin-bottom: 6px;
    }

    .mini-stock {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      padding: 8px 0;
    }

    .mini-stock +
    .mini-stock {
      border-top:
        1px solid rgba(255,255,255,.04);
    }

    .mini-stock-name {
      font-size: 14px;
      font-weight: 800;
    }

    .mini-stock-code {
      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
    }

    .mini-stock-rate {
      font-size: 14px;
      font-weight: 900;
    }

    /* =====================================================
       STOCK CARD
    ===================================================== */

    .stock-list {
      display: grid;

      gap: 13px;
    }

    .stock-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.018),
          transparent
        ),
        var(--panel);

      border:
        1px solid var(--line);

      border-radius: 20px;

      padding: 16px;
    }

    .stock-card.entry {
      border-color:
        rgba(93,140,255,.4);
    }

    .stock-card.leader {
      border-color:
        rgba(255,92,108,.32);
    }

    .stock-card.early {
      border-color:
        rgba(69,217,139,.32);
    }

    .stock-card.exhaustion {
      border-color:
        rgba(255,159,67,.38);
    }

    .stock-top {
      display: flex;

      justify-content:
        space-between;

      gap: 12px;

      align-items:
        flex-start;
    }

    .stock-rank {
      color: var(--muted);

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 6px;
    }

    .stock-name {
      font-size: 20px;
      font-weight: 900;
    }

    .stock-code {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;
    }

    .main-score {
      text-align: right;
    }

    .main-score-label {
      color: var(--muted);

      font-size: 11px;

      font-weight: 900;
    }

    .main-score-value {
      margin-top: 2px;

      color: var(--blue);

      font-size: 34px;
      font-weight: 950;

      line-height: 1;
    }

    .stock-card.leader
    .main-score-value {
      color: var(--red);
    }

    .stock-card.early
    .main-score-value {
      color: var(--green);
    }

    .stock-card.exhaustion
    .main-score-value {
      color: var(--orange);
    }

    .price-line {
      display: flex;

      align-items: baseline;

      gap: 10px;

      margin-top: 17px;
    }

    .price {
      font-size: 23px;
      font-weight: 900;
    }

    .rate {
      font-size: 17px;
      font-weight: 900;
    }

    .up {
      color: var(--red);
    }

    .down {
      color: var(--blue);
    }

    /* =====================================================
       ALIGNMENT
    ===================================================== */

    .alignment-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      margin-top: 15px;

      padding: 11px 12px;

      border-radius: 13px;

      background: var(--panel2);
    }

    .alignment-title {
      color: var(--muted);

      font-size: 11px;
    }

    .alignment {
      font-size: 13px;
      font-weight: 900;
    }

    .alignment.PERFECT {
      color: var(--green);
    }

    .alignment.BULLISH {
      color: #6de3aa;
    }

    .alignment.FORMING {
      color: var(--yellow);
    }

    .alignment.MIXED {
      color: var(--muted);
    }

    .alignment.BROKEN {
      color: var(--red);
    }

    /* =====================================================
       SCORE GRID
    ===================================================== */

    .score-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 7px;

      margin-top: 12px;
    }

    .score-box {
      background: var(--panel2);

      border-radius: 12px;

      padding: 10px 5px;

      text-align: center;
    }

    .score-box-label {
      color: var(--muted);

      font-size: 9px;
      font-weight: 900;
    }

    .score-box-value {
      margin-top: 5px;

      font-size: 17px;
      font-weight: 900;
    }

    /* =====================================================
       INDICATORS
    ===================================================== */

    .indicator-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 7px;

      margin-top: 10px;
    }

    .indicator {
      display: flex;

      justify-content:
        space-between;

      gap: 8px;

      background:
        rgba(255,255,255,.025);

      border-radius: 11px;

      padding: 9px 10px;

      font-size: 11px;
    }

    .indicator-label {
      color: var(--muted);
    }

    .indicator-value {
      font-weight: 850;
    }

    /* =====================================================
       CHART
    ===================================================== */

    .chart-wrap {
      margin-top: 14px;

      background:
        #0b0e14;

      border:
        1px solid rgba(255,255,255,.05);

      border-radius: 14px;

      padding:
        10px 8px 8px;
    }

    .chart-head {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 8px;

      margin-bottom: 8px;
    }

    .chart-title {
      color: var(--muted);

      font-size: 10px;
      font-weight: 800;
    }

    .legend {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      justify-content:
        flex-end;
    }

    .legend-item {
      font-size: 9px;

      font-weight: 800;
    }

    .legend-item.close {
      color: white;
    }

    .legend-item.ma5 {
      color: var(--ma5);
    }

    .legend-item.ma10 {
      color: var(--ma10);
    }

    .legend-item.ma20 {
      color: var(--ma20);
    }

    .legend-item.ma40 {
      color: var(--ma40);
    }

    canvas {
      display: block;

      width: 100%;

      height: 170px;
    }

    /* =====================================================
       FOOT
    ===================================================== */

    .stock-foot {
      margin-top: 11px;

      color: var(--muted2);

      font-size: 10px;
    }

    .loading {
      padding: 60px 20px;

      text-align: center;

      color: var(--muted);
    }

    .error {
      padding: 16px;

      border-radius: 14px;

      border:
        1px solid rgba(255,92,108,.3);

      background:
        rgba(255,92,108,.08);

      color: var(--red);

      line-height: 1.6;
    }

    footer {
      margin-top: 45px;

      text-align: center;

      color: #596273;

      font-size: 10px;
    }

    @media (
      max-width: 430px
    ) {
      .app {
        padding-left: 13px;
        padding-right: 13px;
      }

      h1 {
        font-size: 29px;
      }

      .score-grid {
        gap: 5px;
      }

      .score-box-value {
        font-size: 16px;
      }

      canvas {
        height: 155px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="brand">
      LEADER CYCLE
    </div>

    <h1>
      시장 주도주 레이더
    </h1>

    <div class="subtitle">
      섹터 사이클과 종목의 진입·주도·초기·소진 구간을 추적합니다.
    </div>

    <div
      id="status"
      class="status"
    ></div>

  </header>


  <div class="nav">

    <a href="#sector-current">
      🔥 주도섹터
    </a>

    <a href="#sector-early">
      🌱 차기섹터
    </a>

    <a href="#sector-exhaustion">
      ⚠️ 종료위험
    </a>

    <a href="#entry">
      🚀 ENTRY
    </a>

    <a href="#leader">
      👑 LEADER
    </a>

    <a href="#early">
      🌱 EARLY
    </a>

    <a href="#exhaustion">
      ⚠️ EXHAUST
    </a>

  </div>


  <div id="app">

    <div class="loading">
      시장 데이터 분석 중...
    </div>

  </div>


  <footer>
    LEADER CYCLE · KRX MARKET DATA
  </footer>

</div>


<script>

/* =========================================================
   API
========================================================= */

const SECTOR_API =
  "/api/sector-scan";

const RANKING_API =
  "/api/rankings";


/* =========================================================
   HELPERS
========================================================= */

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function formatRate(value) {

  const n =
    number(value);

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}


function formatPrice(value) {

  return Math.round(
    number(value)
  ).toLocaleString() + "원";
}


function formatMoney(value) {

  const n =
    number(value);

  if (n >= 1e12) {

    return (
      n / 1e12
    ).toFixed(1) + "조";
  }

  if (n >= 1e8) {

    return (
      n / 1e8
    ).toFixed(0) + "억";
  }

  if (n >= 1e4) {

    return (
      n / 1e4
    ).toFixed(0) + "만";
  }

  return Math.round(
    n
  ).toLocaleString();
}


function rateClass(value) {

  const n =
    number(value);

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "";
}


/* =========================================================
   SECTOR MINI STOCK
========================================================= */

function miniStockHTML(stock) {

  return `
    <div class="mini-stock">

      <div>

        <div class="mini-stock-name">
          ${escapeHTML(stock.name || "-")}
        </div>

        <div class="mini-stock-code">
          ${escapeHTML(stock.code || "")}
          ·
          ${escapeHTML(stock.market || "")}
        </div>

      </div>

      <div
        class="
          mini-stock-rate
          ${rateClass(stock.changeRate)}
        "
      >
        ${formatRate(stock.changeRate)}
      </div>

    </div>
  `;
}


/* =========================================================
   SECTOR CARD
========================================================= */

function sectorHTML(
  sector,
  index,
  type = "normal"
) {

  const leaders =
    Array.isArray(
      sector.leaders
    )
      ? sector.leaders
      : [];

  const exhaust =
    number(
      sector.exhaustion ??
      sector.scores?.exhaustion
    );

  return `
    <div
      class="
        sector
        ${type === "exhaustion"
          ? "exhaust"
          : ""}
      "
    >

      <div class="sector-top">

        <div>

          <div class="rank">
            #${index + 1}
          </div>

          <div class="sector-name">
            ${escapeHTML(
              sector.name ||
              sector.id ||
              "-"
            )}
          </div>

        </div>

        <div
          class="
            stage
            ${escapeHTML(
              sector.stage ||
              "WATCH"
            )}
          "
        >
          ${escapeHTML(
            sector.stage ||
            "WATCH"
          )}
        </div>

      </div>


      <div class="sector-scores">

        <div class="sector-score">

          <div class="sector-score-label">
            HAN
          </div>

          <div class="sector-score-value han">
            ${number(
              sector.han ??
              sector.scores?.han
            )}
          </div>

        </div>


        <div class="sector-score">

          <div class="sector-score-label">
            EARLY
          </div>

          <div class="sector-score-value early">
            ${number(
              sector.early ??
              sector.scores?.early
            )}
          </div>

        </div>


        <div class="sector-score">

          <div class="sector-score-label">
            EXHAUST
          </div>

          <div class="sector-score-value exhaustion">
            ${exhaust}
          </div>

        </div>

      </div>


      <div class="metrics">

        <span>
          종목
          ${number(
            sector.stockCount
          )}개
        </span>

        <span>
          상승비율
          ${number(
            sector.advanceRatio
          ).toFixed(1)}%
        </span>

        <span>
          평균
          ${formatRate(
            sector.averageChangeRate
          )}
        </span>

        <span>
          거래비중
          ${number(
            sector.tradingShare
          ).toFixed(1)}%
        </span>

      </div>


      ${
        leaders.length
          ? `
            <div class="leaders">

              <div class="leaders-title">
                섹터 거래대금 리더
              </div>

              ${
                leaders
                  .slice(0, 5)
                  .map(miniStockHTML)
                  .join("")
              }

            </div>
          `
          : ""
      }

    </div>
  `;
}


/* =========================================================
   SECTOR SECTION
========================================================= */

function sectorSectionHTML(
  id,
  title,
  desc,
  sectors,
  type = "normal"
) {

  if (
    !Array.isArray(sectors) ||
    !sectors.length
  ) {
    return "";
  }

  return `
    <section id="${id}">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="sector-list">

        ${
          sectors
            .slice(0, 10)
            .map(
              (sector, index) =>
                sectorHTML(
                  sector,
                  index,
                  type
                )
            )
            .join("")
        }

      </div>

    </section>
  `;
}


/* =========================================================
   ALIGNMENT
========================================================= */

function alignmentIcon(
  alignment
) {

  switch (alignment) {

    case "PERFECT":
      return "🟢";

    case "BULLISH":
      return "🟢";

    case "FORMING":
      return "🟡";

    case "BROKEN":
      return "🔴";

    default:
      return "⚪";
  }
}


/* =========================================================
   STOCK CARD
========================================================= */

let chartCounter = 0;

const chartJobs = [];


function stockHTML(
  stock,
  type
) {

  const score =
    number(
      stock.scores?.[type]
    );

  const indicators =
    stock.indicators || {};

  const chartId =
    `chart-${++chartCounter}`;

  chartJobs.push({
    id:
      chartId,

    chart:
      Array.isArray(
        stock.chart
      )
        ? stock.chart
        : []
  });

  return `
    <div class="stock-card ${type}">

      <div class="stock-top">

        <div>

          <div class="stock-rank">
            #${number(stock.rank)}
          </div>

          <div class="stock-name">
            ${escapeHTML(
              stock.name ||
              "-"
            )}
          </div>

          <div class="stock-code">
            ${escapeHTML(
              stock.code ||
              ""
            )}
            ·
            ${escapeHTML(
              stock.market ||
              ""
            )}
          </div>

        </div>


        <div class="main-score">

          <div class="main-score-label">
            ${type.toUpperCase()}
          </div>

          <div class="main-score-value">
            ${score.toFixed(1)}
          </div>

        </div>

function stockSectionHTML(
  id,
  title,
  desc,
  ranking,
  type
) {

  if (
    !Array.isArray(ranking) ||
    !ranking.length
  ) {
    return "";
  }

  return `
    <section id="${id}">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="stock-list">

        ${
          ranking
            .slice(0, 10)
            .map(
              stock =>
                stockHTML(
                  stock,
                  type
                )
            )
            .join("")
        }

      </div>

    </section>
  `;
}


/* =========================================================
   CANVAS CHART
========================================================= */

function drawChart(
  canvas,
  rows
) {

  if (
    !canvas ||
    !Array.isArray(rows) ||
    rows.length < 2
  ) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio ||
      1
    );

  const width =
    Math.max(
      280,
      rect.width
    );

  const height =
    Math.max(
      150,
      rect.height
    );

  canvas.width =
    Math.round(
      width * dpr
    );

  canvas.height =
    Math.round(
      height * dpr
    );

  const ctx =
    canvas.getContext(
      "2d"
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const padding = {
    left: 7,
    right: 7,
    top: 8,
    bottom: 14
  };

  const plotWidth =
    width -
    padding.left -
    padding.right;

  const plotHeight =
    height -
    padding.top -
    padding.bottom;

  const keys = [
    "close",
    "ma5",
    "ma10",
    "ma20",
    "ma40"
  ];

  const values = [];

  for (const row of rows) {

    for (const key of keys) {

      const value =
        Number(
          row?.[key]
        );

      if (
        Number.isFinite(value) &&
        value > 0
      ) {
        values.push(
          value
        );
      }
    }
  }

  if (!values.length) {
    return;
  }

  let min =
    Math.min(...values);

  let max =
    Math.max(...values);

  if (min === max) {
    min *= .98;
    max *= 1.02;
  }

  const margin =
    (
      max - min
    ) * 0.08;

  min -= margin;
  max += margin;

  function x(index) {

    if (
      rows.length <= 1
    ) {
      return padding.left;
    }

    return (
      padding.left +
      (
        index /
        (
          rows.length - 1
        )
      ) *
      plotWidth
    );
  }

  function y(value) {

    return (
      padding.top +
      (
        1 -
        (
          value - min
        ) /
        (
          max - min
        )
      ) *
      plotHeight
    );
  }

  /* grid */

  ctx.strokeStyle =
    "rgba(255,255,255,.055)";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i <= 4;
    i++
  ) {

    const gy =
      padding.top +
      (
        plotHeight *
        i /
        4
      );

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      gy
    );

    ctx.lineTo(
      width -
      padding.right,
      gy
    );

    ctx.stroke();
  }

  /* line helper */

  function drawLine(
    key,
    color,
    lineWidth,
    alpha = 1
  ) {

    ctx.beginPath();

    ctx.strokeStyle =
      color;

    ctx.globalAlpha =
      alpha;

    ctx.lineWidth =
      lineWidth;

    ctx.lineJoin =
      "round";

    ctx.lineCap =
      "round";

    let started =
      false;

    rows.forEach(
      (row, index) => {

        const value =
          Number(
            row?.[key]
          );

        if (
          !Number.isFinite(value) ||
          value <= 0
        ) {
          started = false;
          return;
        }

        const px =
          x(index);

        const py =
          y(value);

        if (!started) {

          ctx.moveTo(
            px,
            py
          );

          started = true;

        } else {

          ctx.lineTo(
            px,
            py
          );
        }
      }
    );

    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  /*
    장기선 먼저,
    가격선 마지막.
  */

  drawLine(
    "ma40",
    "#aa7cff",
    1.5,
    .9
  );

  drawLine(
    "ma20",
    "#45d98b",
    1.5,
    .9
  );

  drawLine(
    "ma10",
    "#5d8cff",
    1.4,
    .9
  );

  drawLine(
    "ma5",
    "#ffd166",
    1.4,
    .95
  );

  drawLine(
    "close",
    "#ffffff",
    2.2,
    1
  );

  /* latest point */

  const latest =
    rows[
      rows.length - 1
    ];

  const latestClose =
    Number(
      latest?.close
    );

  if (
    Number.isFinite(
      latestClose
    ) &&
    latestClose > 0
  ) {

    ctx.beginPath();

    ctx.fillStyle =
      "#ffffff";

    ctx.arc(
      x(
        rows.length - 1
      ),
      y(
        latestClose
      ),
      3,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  /* date */

  const firstDate =
    String(
      rows[0]?.date ||
      ""
    );

  const lastDate =
    String(
      latest?.date ||
      ""
    );

  ctx.fillStyle =
    "#626d80";

  ctx.font =
    "9px -apple-system, BlinkMacSystemFont, sans-serif";

  ctx.textBaseline =
    "bottom";

  ctx.textAlign =
    "left";

  ctx.fillText(
    firstDate.slice(4),
    padding.left,
    height
  );

  ctx.textAlign =
    "right";

  ctx.fillText(
    lastDate.slice(4),
    width -
    padding.right,
    height
  );
}


/* =========================================================

========================================================= */

function drawAllCharts() {

  for (
    const job of chartJobs

    const canvas =
      document.getElementById(
        job.id
      );

    drawChart(
      canvas,
      job.chart
    );
  }
}


/* =========================================================
   SECTOR EXHAUSTION
========================================================= */

function getSectorExhaustion(
  sectorData
) {

  /*
    V3 API에 sectorExhaustionRanking이 있으면
    그것을 우선 사용.
  */

  const direct =
    sectorData
      ?.sectorExhaustionRanking;

  if (
    Array.isArray(direct) &&
    direct.length
  ) {
    return direct;
  }

  /*
    아니면 sectors에서
    exhaustion 점수 기준으로 생성.
  */

  const sectors =
    Array.isArray(
      sectorData?.sectors
    )
      ? sectorData.sectors
      : [];

  return sectors
    .filter(
      sector =>
        number(
          sector.exhaustion ??
          sector.scores?.exhaustion
        ) > 0
    )
    .sort(
      (a, b) =>
        number(
          b.exhaustion ??
          b.scores?.exhaustion
        ) -
        number(
          a.exhaustion ??
          a.scores?.exhaustion
        )
    )
    .slice(
      0,
      10
    );
}


/* =========================================================
   LOAD
========================================================= */

async function load() {

  const app =
    document.getElementById(
      "app"
    );

  const status =
    document.getElementById(
      "status"
    );

  try {

    chartJobs.length = 0;

    chartCounter = 0;


    const [
      sectorResponse,
      rankingResponse
    ] =
      await Promise.all([

        fetch(
          SECTOR_API,
          {
            cache:
              "no-store"
          }
        ),

        fetch(
          RANKING_API,
          {
            cache:
              "no-store"
          }
        )
      ]);


    if (
      !sectorResponse.ok
    ) {
      throw new Error(
        `sector-scan HTTP ${sectorResponse.status}`
      );
    }


    if (
      !rankingResponse.ok
    ) {
      throw new Error(
        `rankings HTTP ${rankingResponse.status}`
      );
    }


    const sectorData =
      await sectorResponse.json();

    const rankingData =
      await rankingResponse.json();


    if (
      !sectorData.ok
    ) {
      throw new Error(
        sectorData.error ||
        "sector-scan 오류"
      );
    }


    if (
      !rankingData.ok
    ) {
      throw new Error(
        rankingData.error ||
        "rankings 오류"
      );
    }


    const currentLeaders =
      Array.isArray(
        sectorData.currentLeaders
      )
        ? sectorData.currentLeaders
        : [];


    const nextLeaderRadar =
      Array.isArray(
        sectorData.nextLeaderRadar
      )
        ? sectorData.nextLeaderRadar
        : [];


    const sectorExhaustion =
      getSectorExhaustion(
        sectorData
      );


    const entryRanking =
      Array.isArray(
        rankingData.entryRanking
      )
        ? rankingData.entryRanking
        : [];


    const leaderRanking =
      Array.isArray(
        rankingData.leaderRanking
      )
        ? rankingData.leaderRanking
        : [];


    const earlyRanking =
      Array.isArray(
        rankingData.earlyRanking
      )
        ? rankingData.earlyRanking
        : [];


    const exhaustionRanking =
      Array.isArray(
        rankingData.exhaustionRanking
      )
        ? rankingData.exhaustionRanking
        : [];


    const coverage =
      sectorData.coverage ||
      {};


    const market =
      sectorData.market ||
      {};


    status.innerHTML = `

      <div class="badge live">
        ● LIVE
      </div>

      <div class="badge">
        기준일
        ${escapeHTML(
          rankingData.date ||
          sectorData.date ||
          "-"
        )}
      </div>

      <div class="badge">
        ${number(
          market.stocks
        ).toLocaleString()}
        종목
      </div>

    `;


    app.innerHTML = `

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            거래대금 커버리지
          </div>

          <div class="summary-value">
            ${number(
              coverage.tradingValueCoverage
            ).toFixed(1)}%
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            분석 섹터
          </div>

          <div class="summary-value">
            ${number(
              market.sectors
            )}개
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            종목 분석
          </div>

          <div class="summary-value">
            ${number(
              rankingData.stats?.analyzed
            )}개
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            완전 정배열
          </div>

          <div class="summary-value">
            ${number(
              rankingData
                .alignmentStats
                ?.PERFECT
            )}개
          </div>

        </div>

      </div>


      ${sectorSectionHTML(
        "sector-current",
        "🔥 현재 주도 섹터",
        "현재 시장의 중심",
        currentLeaders
      )}


      ${sectorSectionHTML(
        "sector-early",
        "🌱 차기 주도 후보",
        "초기 확산 신호",
        nextLeaderRadar
      )}


      ${sectorSectionHTML(
        "sector-exhaustion",
        "⚠️ 공세 종료 위험 섹터",
        "과열·확산 둔화",
        sectorExhaustion,
        "exhaustion"
      )}


      ${stockSectionHTML(
        "entry",
        "🚀 ENTRY",
        "지금 진입 위치가 좋은 공세 시작 후보",
        entryRanking,
        "entry"
      )}


      ${stockSectionHTML(
        "leader",
        "👑 LEADER",
        "현재 시장을 실제로 이끄는 종목",
        leaderRanking,
        "leader"
      )}


      ${stockSectionHTML(
        "early",
        "🌱 EARLY",
        "차기 주도주 전환 후보",
        earlyRanking,
        "early"
      )}


      ${stockSectionHTML(
        "exhaustion",
        "⚠️ EXHAUSTION",
        "상승 에너지 소진 위험 종목",
        exhaustionRanking,
        "exhaustion"
      )}

    `;


    requestAnimationFrame(
      () => {

        requestAnimationFrame(
          drawAllCharts
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );

    app.innerHTML = `

      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${escapeHTML(
          error?.message ||
          error
        )}

        <br><br>

        /api/sector-scan 과
        /api/rankings 상태를 확인해주세요.

      </div>

    `;
  }
}

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>LEADER CYCLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --panel: #11151c;
      --panel2: #171c25;
      --line: #242b36;
      --text: #f5f7fa;
      --muted: #8d97a8;

      --red: #ff5364;
      --green: #39d98a;
      --blue: #5d8cff;
      --yellow: #ffd166;
      --purple: #a778ff;
      --orange: #ff9f43;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(93,140,255,.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;

      padding:
        calc(22px + env(safe-area-inset-top))
        16px
        calc(40px + env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 24px;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.4px;
      color: var(--blue);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -1.2px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .badge.ready {
      color: var(--green);
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .nav a {
      text-decoration: none;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 800;
    }

    .nav a:active {
      transform: scale(.98);
    }

    section {
      margin-top: 32px;
      scroll-margin-top: 12px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .section-desc {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .summary-label {
      font-size: 11px;
      color: var(--muted);
    }

    .summary-value {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 900;
    }

    /* =====================================================
       SECTOR
    ===================================================== */

    .sector-list {
      display: grid;
      gap: 10px;
    }

    .sector {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .sector-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .rank {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .sector-name {
      font-size: 20px;
      font-weight: 850;
    }

    .stage {
      font-size: 11px;
      font-weight: 900;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(93,140,255,.12);
      color: var(--blue);
      white-space: nowrap;
    }

    .stage.STRONG {
      background: rgba(255,83,100,.12);
      color: var(--red);
    }

    .stage.EMERGING {
      background: rgba(57,217,138,.12);
      color: var(--green);
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .score {
      background: var(--panel2);
      border-radius: 12px;
      padding: 11px;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
    }

    .score-value {
      margin-top: 3px;
      font-size: 22px;
      font-weight: 900;
    }

    .han {
      color: var(--red);
    }

    .early-color {
      color: var(--green);
    }

    .metrics {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .leaders {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
    }

    .leaders-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      gap: 10px;
    }

    .stock + .stock {
      border-top: 1px solid rgba(255,255,255,.04);
    }

    .stock-name {
      font-weight: 700;
      font-size: 14px;
    }

    .stock-code {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .stock-rate {
      font-weight: 800;
      font-size: 14px;
    }

    .up {
      color: var(--red);
    }

    .down {
      color: var(--blue);
    }

    /* =====================================================
       STOCK RANKINGS
    ===================================================== */

    .ranking-block {
      margin-top: 34px;
    }

    .ranking-list {
      display: grid;
      gap: 10px;
    }

    .ranking-card {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.03),
          transparent 60%
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
    }

    .ranking-card.entry {
      border-color: rgba(93,140,255,.28);
    }

    .ranking-card.leader {
      border-color: rgba(255,209,102,.24);
    }

    .ranking-card.early {
      border-color: rgba(57,217,138,.24);
    }

    .ranking-card.exhaustion {
      border-color: rgba(255,83,100,.25);
    }

    .ranking-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .ranking-left {
      min-width: 0;
    }

    .ranking-number {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .ranking-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.4px;
    }

    .ranking-code {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .main-score {
      text-align: right;
      flex-shrink: 0;
    }

    .main-score-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 800;
    }

    .main-score-value {
      margin-top: 2px;
      font-size: 27px;
      line-height: 1;
      font-weight: 950;
    }

    .main-score-value.entry {
      color: var(--blue);
    }

    .main-score-value.leader {
      color: var(--yellow);
    }

    .main-score-value.early {
      color: var(--green);
    }

    .main-score-value.exhaustion {
      color: var(--red);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-top: 12px;
    }

    .price {
      font-size: 17px;
      font-weight: 850;
    }

    .change {
      font-size: 13px;
      font-weight: 850;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 13px;
    }

    .mini-score {
      background: var(--panel2);
      border-radius: 10px;
      padding: 9px 5px;
      text-align: center;
    }

    .mini-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .mini-value {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 900;
    }

    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-top: 9px;
    }

    .indicator {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      font-size: 11px;
    }

    .indicator-label {
      color: var(--muted);
    }

    .indicator-value {
      font-weight: 800;
    }

    .history-line {
      margin-top: 10px;
      color: #667184;
      font-size: 10px;
    }

    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: rgba(255,83,100,.08);
      border: 1px solid rgba(255,83,100,.25);
      border-radius: 14px;
      padding: 16px;
      line-height: 1.6;
      margin-top: 12px;
    }

    .sub-error {
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      line-height: 1.5;
      font-size: 12px;
    }

    footer {
      color: #596273;
      text-align: center;
      font-size: 11px;
      margin-top: 40px;
    }

    @media (max-width: 420px) {
      .app {
        padding-left: 13px;
        padding-right: 13px;
      }

      h1 {
        font-size: 28px;
      }

      .ranking-name {
        font-size: 17px;
      }

      .main-score-value {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      LEADER CYCLE
    </div>

    <h1>
      시장 주도주 레이더
    </h1>

    <div class="subtitle">
      현재 주도 섹터부터 공세 시작 종목까지 한 번에 추적합니다.
    </div>

    <div
      id="status"
      class="status"
    ></div>

    <div class="nav">
      <a href="#sector-current">
        🔥 주도섹터
      </a>

      <a href="#entry-ranking">
        🚀 ENTRY
      </a>

      <a href="#leader-ranking">
        👑 LEADER
      </a>

      <a href="#early-ranking">
        🌱 EARLY
      </a>

      <a href="#exhaustion-ranking">
        ⚠️ 소진
      </a>

      <a href="#sector-radar">
        📡 차기섹터
      </a>
    </div>
  </header>


  <div id="app">
    <div class="loading">
      시장 데이터 분석 중...
    </div>
  </div>


  <footer>
    LEADER CYCLE · KRX MARKET DATA
  </footer>

</div>


<script>

const SECTOR_API =
  "/api/sector-scan";

const RANKING_API =
  "/api/rankings";


/* =========================================================
   HELPERS
========================================================= */

function number(value) {
  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function escapeHTML(value) {
  return String(
    value ?? ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatRate(value) {
  const n =
    number(value);

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}


function formatMoney(value) {
  const n =
    number(value);

  if (n >= 1e12) {
    return (
      n / 1e12
    ).toFixed(1) + "조";
  }

  if (n >= 1e8) {
    return (
      n / 1e8
    ).toFixed(0) + "억";
  }

  if (n >= 1e4) {
    return (
      n / 1e4
    ).toFixed(0) + "만";
  }

  return Math.round(n)
    .toLocaleString();
}


function formatPrice(value) {
  return Math.round(
    number(value)
  ).toLocaleString() + "원";
}


function rateClass(value) {
  const n =
    number(value);

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "";
}


/* =========================================================
   SECTOR STOCK
========================================================= */

function stockHTML(stock) {
  const rate =
    number(
      stock.changeRate
    );

  return `
    <div class="stock">

      <div>
        <div class="stock-name">
          ${escapeHTML(
            stock.name || "-"
          )}
        </div>

        <div class="stock-code">
          ${escapeHTML(
            stock.code || ""
          )}
          ·
          ${escapeHTML(
            stock.market || ""
          )}
        </div>
      </div>

      <div class="stock-rate ${rateClass(rate)}">
        ${formatRate(rate)}
      </div>

    </div>
  `;
}


/* =========================================================
   SECTOR CARD
========================================================= */

function sectorHTML(
  sector,
  index
) {
  const leaders =
    Array.isArray(
      sector.leaders
    )
      ? sector.leaders
      : [];

  return `
    <div class="sector">

      <div class="sector-top">

        <div>
          <div class="rank">
            #${index + 1}
          </div>

          <div class="sector-name">
            ${escapeHTML(
              sector.name ||
              sector.id ||
              "-"
            )}
          </div>
        </div>

        <div class="stage ${escapeHTML(
          sector.stage || ""
        )}">
          ${escapeHTML(
            sector.stage ||
            "WATCH"
          )}
        </div>

      </div>


      <div class="scores">

        <div class="score">
          <div class="score-label">
            HAN · 현재 주도력
          </div>

          <div class="score-value han">
            ${number(
              sector.han
            ).toFixed(1)}
          </div>
        </div>


        <div class="score">
          <div class="score-label">
            EARLY · 선행 신호
          </div>

          <div class="score-value early-color">
            ${number(
              sector.early
            ).toFixed(1)}
          </div>
        </div>

      </div>


      <div class="metrics">

        <span>
          종목 ${number(
            sector.stockCount
          )}개
        </span>

        <span>
          상승비율 ${number(
            sector.advanceRatio
          ).toFixed(1)}%
        </span>

        <span>
          평균 ${formatRate(
            sector.averageChangeRate
          )}
        </span>

        <span>
          거래비중 ${number(
            sector.tradingShare
          ).toFixed(1)}%
        </span>

      </div>


      ${
        leaders.length
          ? `
            <div class="leaders">

              <div class="leaders-title">
                섹터 거래대금 리더
              </div>

              ${
                leaders
                  .slice(0, 5)
                  .map(stockHTML)
                  .join("")
              }

            </div>
          `
          : ""
      }

    </div>
  `;
}


/* =========================================================
   SECTOR SECTION
========================================================= */

function sectorSectionHTML(
  id,
  title,
  desc,
  sectors
) {
  if (
    !Array.isArray(sectors) ||
    !sectors.length
  ) {
    return "";
  }

  return `
    <section id="${id}">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="sector-list">

        ${
          sectors
            .slice(0, 10)
            .map(sectorHTML)
            .join("")
        }

      </div>

    </section>
  `;
}


/* =========================================================
   RANKING CARD
========================================================= */

function rankingCardHTML(
  stock,
  index,
  type
) {
  const scores =
    stock.scores || {};

  const indicators =
    stock.indicators || {};

  const mainScore =
    number(
      scores[type]
    );

  const changeRate =
    number(
      stock.changeRate
    );

  return `
    <div class="ranking-card ${type}">

      <div class="ranking-top">

        <div class="ranking-left">

          <div class="ranking-number">
            #${index + 1}
          </div>

          <div class="ranking-name">
            ${escapeHTML(
              stock.name || "-"
            )}
          </div>

          <div class="ranking-code">
            ${escapeHTML(
              stock.code || ""
            )}
            ·
            ${escapeHTML(
              stock.market || ""
            )}
          </div>

        </div>


        <div class="main-score">

          <div class="main-score-label">
            ${type.toUpperCase()}
          </div>

          <div class="main-score-value ${type}">
            ${mainScore.toFixed(1)}
          </div>

        </div>

      </div>


      <div class="price-row">

        <div class="price">
          ${formatPrice(
            stock.close
          )}
        </div>

        <div class="change ${rateClass(changeRate)}">
          ${formatRate(
            changeRate
          )}
        </div>

      </div>


      <div class="score-grid">

        <div class="mini-score">
          <div class="mini-label">
            ENTRY
          </div>
          <div class="mini-value">
            ${number(
              scores.entry
            ).toFixed(1)}
          </div>
        </div>

        <div class="mini-score">
          <div class="mini-label">
            LEADER
          </div>
          <div class="mini-value">
            ${number(
              scores.leader
            ).toFixed(1)}
          </div>
        </div>

        <div class="mini-score">
          <div class="mini-label">
            EARLY
          </div>
          <div class="mini-value">
            ${number(
              scores.early
            ).toFixed(1)}
          </div>
        </div>

        <div class="mini-score">
          <div class="mini-label">
            EXHAUST
          </div>
          <div class="mini-value">
            ${number(
              scores.exhaustion
            ).toFixed(1)}
          </div>
        </div>

      </div>


      <div class="indicator-grid">

        <div class="indicator">
          <span class="indicator-label">
            5일 수익률
          </span>

          <span class="indicator-value ${rateClass(
            indicators.return5
          )}">
            ${formatRate(
              indicators.return5
            )}
          </span>
        </div>


        <div class="indicator">
          <span class="indicator-label">
            20일 수익률
          </span>

          <span class="indicator-value ${rateClass(
            indicators.return20
          )}">
            ${formatRate(
              indicators.return20
            )}
          </span>
        </div>


        <div class="indicator">
          <span class="indicator-label">
            MA20 이격
          </span>

          <span class="indicator-value">
            ${formatRate(
              indicators.distanceMa20
            )}
          </span>
        </div>


        <div class="indicator">
          <span class="indicator-label">
            거래량 배수
          </span>

          <span class="indicator-value">
            ${number(
              indicators.volumeRatio
            ).toFixed(2)}x
          </span>
        </div>


        <div class="indicator">
          <span class="indicator-label">
            거래대금 배수
          </span>

          <span class="indicator-value">
            ${number(
              indicators.tradingValueRatio
            ).toFixed(2)}x
          </span>
        </div>


        <div class="indicator">
          <span class="indicator-label">
            거래대금
          </span>

          <span class="indicator-value">
            ${formatMoney(
              stock.tradingValue
            )}
          </span>
        </div>

      </div>


      <div class="history-line">
        히스토리 ${number(
          stock.historyDays
        )}일
        ·
        Discovery ${number(
          stock.discoveryScore
        ).toFixed(1)}
      </div>

    </div>
  `;
}


/* =========================================================
   RANKING SECTION
========================================================= */

function rankingSectionHTML(
  id,
  title,
  desc,
  ranking,
  type
) {
  if (
    !Array.isArray(ranking) ||
    !ranking.length
  ) {
    return `
      <section id="${id}">
        <div class="section-head">
          <div class="section-title">
            ${title}
          </div>
        </div>

        <div class="sub-error">
          표시할 랭킹 데이터가 없습니다.
        </div>
      </section>
    `;
  }

  return `
    <section
      id="${id}"
      class="ranking-block"
    >

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="ranking-list">

        ${
          ranking
            .slice(0, 10)
            .map(
              (stock, index) =>
                rankingCardHTML(
                  stock,
                  index,
                  type
                )
            )
            .join("")
        }

      </div>

    </section>
  `;
}


/* =========================================================
   LOAD API
========================================================= */

async function fetchAPI(url) {
  const response =
    await fetch(
      url,
      {
        cache:
          "no-store"
      }
    );

  if (!response.ok) {
    throw new Error(
      `${url} HTTP ${response.status}`
    );
  }

  const data =
    await response.json();

  if (
    !data ||
    data.ok === false
  ) {
    throw new Error(
      data?.error ||
      `${url} API 응답 오류`
    );
  }

  return data;
}


/* =========================================================
   MAIN
========================================================= */

async function load() {
  const app =
    document.getElementById(
      "app"
    );

  const status =
    document.getElementById(
      "status"
    );

  try {
    /*
      둘을 동시에 호출해서
      전체 로딩 시간을 줄인다.
    */

    const results =
      await Promise.allSettled([
        fetchAPI(
          SECTOR_API
        ),

        fetchAPI(
          RANKING_API
        )
      ]);

    const sectorResult =
      results[0];

    const rankingResult =
      results[1];

    const sectorData =
      sectorResult.status ===
      "fulfilled"
        ? sectorResult.value
        : null;

    const rankingData =
      rankingResult.status ===
      "fulfilled"
        ? rankingResult.value
        : null;


    /*
      둘 다 실패했을 때만
      전체 에러 처리
    */

    if (
      !sectorData &&
      !rankingData
    ) {
      throw new Error(
        [
          sectorResult.reason?.message,
          rankingResult.reason?.message
        ]
          .filter(Boolean)
          .join(" / ")
      );
    }


    const displayDate =
      rankingData?.date ||
      sectorData?.date ||
      "-";


    const marketStocks =
      number(
        rankingData?.stats
          ?.marketStocks ??
        sectorData?.market
          ?.stocks
      );


    status.innerHTML = `

      <div class="badge ready">
        ● LIVE
      </div>

      <div class="badge">
        기준일 ${escapeHTML(
          displayDate
        )}
      </div>

      <div class="badge">
        ${marketStocks.toLocaleString()} 종목
      </div>

      ${
        rankingData
          ? `
            <div class="badge">
              분석 ${number(
                rankingData.stats
                  ?.analyzed
              )}종목
            </div>
          `
          : ""
      }

    `;


    /* =====================================================
       SUMMARY
    ===================================================== */

    const coverage =
      sectorData?.coverage ||
      {};

    const sectorMarket =
      sectorData?.market ||
      {};

    const rankingStats =
      rankingData?.stats ||
      {};

    let html = `

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            분석 종목
          </div>

          <div class="summary-value">
            ${number(
              rankingStats.analyzed
            ).toLocaleString()}
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            분석 섹터
          </div>

          <div class="summary-value">
            ${number(
              sectorMarket.sectors
            )}개
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            거래대금 커버리지
          </div>

          <div class="summary-value">
            ${number(
              coverage.tradingValueCoverage
            ).toFixed(1)}%
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            History 종목
          </div>

          <div class="summary-value">
            ${number(
              rankingData
                ?.historyDiagnostic
                ?.historyFileStocks
            ).toLocaleString()}
          </div>

        </div>

      </div>
    `;


    /* =====================================================
       CURRENT SECTOR
    ===================================================== */

    if (sectorData) {
      const current =
        Array.isArray(
          sectorData.currentLeaders
        )
          ? sectorData.currentLeaders
          : [];

      html +=
        sectorSectionHTML(
          "sector-current",
          "🔥 현재 주도 섹터",
          "HAN · 시장을 실제로 이끄는 섹터",
          current
        );
    } else {
      html += `
        <section id="sector-current">

          <div class="section-head">
            <div class="section-title">
              🔥 현재 주도 섹터
            </div>
          </div>

          <div class="sub-error">
            sector-scan을 불러오지 못했습니다.
          </div>

        </section>
      `;
    }


    /* =====================================================
       STOCK RANKINGS
    ===================================================== */

    if (rankingData) {
      html +=
        rankingSectionHTML(
          "entry-ranking",
          "🚀 ENTRY",
          "지금 진입 위치가 좋은 공세 시작 후보",
          rankingData.entryRanking,
          "entry"
        );

      html +=
        rankingSectionHTML(
          "leader-ranking",
          "👑 LEADER",
          "현재 시장을 실제로 이끄는 강한 종목",
          rankingData.leaderRanking,
          "leader"
        );

      html +=
        rankingSectionHTML(
          "early-ranking",
          "🌱 EARLY",
          "차기 주도주로 전환될 가능성이 높은 후보",
          rankingData.earlyRanking,
          "early"
        );

      html +=
        rankingSectionHTML(
          "exhaustion-ranking",
          "⚠️ EXHAUSTION",
          "상승 에너지 소진 위험이 높은 종목",
          rankingData.exhaustionRanking,
          "exhaustion"
        );

    } else {
      html += `
        <section id="entry-ranking">

          <div class="section-head">
            <div class="section-title">
              🚀 종목 랭킹
            </div>
          </div>

          <div class="sub-error">
            rankings API를 불러오지 못했습니다.
          </div>

        </section>
      `;
    }


    /* =====================================================
       NEXT SECTOR
    ===================================================== */

    if (sectorData) {
      const radar =
        Array.isArray(
          sectorData.nextLeaderRadar
        )
          ? sectorData.nextLeaderRadar
          : [];

      html +=
        sectorSectionHTML(
          "sector-radar",
          "📡 차기 주도 섹터",
          "EARLY · 다음 순환 후보",
          radar
        );
    }


    app.innerHTML =
      html;

  } catch (error) {
    app.innerHTML = `
      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${escapeHTML(
          error?.message ||
          error
        )}

        <br><br>

        /api/sector-scan 및
        /api/rankings 상태를 확인해주세요.

      </div>
    `;
  }
}


load();

</script>

</body>
</html>

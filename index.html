<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>LEADER CYCLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --panel: #11151c;
      --panel2: #171c25;
      --line: #242b36;
      --text: #f5f7fa;
      --muted: #8d97a8;

      --red: #ff5364;
      --green: #39d98a;
      --blue: #5d8cff;
      --yellow: #ffd166;
      --purple: #a778ff;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(93,140,255,.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding:
        calc(22px + env(safe-area-inset-top))
        16px
        calc(40px + env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 24px;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.4px;
      color: var(--blue);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -1.2px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
    }

    .status {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .badge.ready {
      color: var(--green);
    }

    section {
      margin-top: 28px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .section-desc {
      font-size: 12px;
      color: var(--muted);
    }

    .sector-list {
      display: grid;
      gap: 10px;
    }

    .sector {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .sector-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .rank {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .sector-name {
      font-size: 20px;
      font-weight: 850;
    }

    .stage {
      font-size: 11px;
      font-weight: 900;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(93,140,255,.12);
      color: var(--blue);
    }

    .stage.STRONG {
      background: rgba(255,83,100,.12);
      color: var(--red);
    }

    .stage.EMERGING {
      background: rgba(57,217,138,.12);
      color: var(--green);
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .score {
      background: var(--panel2);
      border-radius: 12px;
      padding: 11px;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
    }

    .score-value {
      margin-top: 3px;
      font-size: 22px;
      font-weight: 900;
    }

    .han {
      color: var(--red);
    }

    .early {
      color: var(--green);
    }

    .metrics {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .leaders {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
    }

    .leaders-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      gap: 10px;
    }

    .stock + .stock {
      border-top: 1px solid rgba(255,255,255,.04);
    }

    .stock-name {
      font-weight: 700;
      font-size: 14px;
    }

    .stock-code {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .stock-rate {
      font-weight: 800;
      font-size: 14px;
    }

    .up {
      color: var(--red);
    }

    .down {
      color: var(--blue);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .summary-label {
      font-size: 11px;
      color: var(--muted);
    }

    .summary-value {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 900;
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: rgba(255,83,100,.08);
      border: 1px solid rgba(255,83,100,.25);
      border-radius: 14px;
      padding: 16px;
      line-height: 1.6;
    }

    footer {
      color: #596273;
      text-align: center;
      font-size: 11px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      LEADER CYCLE
    </div>

    <h1>
      시장 주도주 레이더
    </h1>

    <div class="subtitle">
      시장의 현재 주도 섹터와 다음 주도 후보를 추적합니다.
    </div>

    <div
      id="status"
      class="status"
    ></div>
  </header>


  <div id="app">
    <div class="loading">
      시장 데이터 분석 중...
    </div>
  </div>


  <footer>
    LEADER CYCLE · KRX MARKET DATA
  </footer>

</div>


<script>

const API =
  "/api/sector-scan";


function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function formatRate(value) {

  const n =
    number(value);

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}


function formatMoney(value) {

  const n =
    number(value);

  if (n >= 1e12) {
    return (
      n / 1e12
    ).toFixed(1) + "조";
  }

  if (n >= 1e8) {
    return (
      n / 1e8
    ).toFixed(0) + "억";
  }

  return n.toLocaleString();
}


function stockHTML(stock) {

  const rate =
    number(
      stock.changeRate
    );

  const rateClass =
    rate > 0
      ? "up"
      : rate < 0
        ? "down"
        : "";

  return `
    <div class="stock">

      <div>
        <div class="stock-name">
          ${stock.name || "-"}
        </div>

        <div class="stock-code">
          ${stock.code || ""}
          ·
          ${stock.market || ""}
        </div>
      </div>

      <div class="stock-rate ${rateClass}">
        ${formatRate(rate)}
      </div>

    </div>
  `;
}


function sectorHTML(
  sector,
  index
) {

  const leaders =
    Array.isArray(
      sector.leaders
    )
      ? sector.leaders
      : [];

  return `
    <div class="sector">

      <div class="sector-top">

        <div>
          <div class="rank">
            #${index + 1}
          </div>

          <div class="sector-name">
            ${sector.name || sector.id}
          </div>
        </div>

        <div class="stage ${sector.stage || ""}">
          ${sector.stage || "WATCH"}
        </div>

      </div>


      <div class="scores">

        <div class="score">
          <div class="score-label">
            HAN · 현재 주도력
          </div>

          <div class="score-value han">
            ${number(sector.han)}
          </div>
        </div>


        <div class="score">
          <div class="score-label">
            EARLY · 선행 신호
          </div>

          <div class="score-value early">
            ${number(sector.early)}
          </div>
        </div>

      </div>


      <div class="metrics">

        <span>
          종목 ${number(sector.stockCount)}개
        </span>

        <span>
          상승비율 ${number(sector.advanceRatio).toFixed(1)}%
        </span>

        <span>
          평균 ${formatRate(sector.averageChangeRate)}
        </span>

        <span>
          거래비중 ${number(sector.tradingShare).toFixed(1)}%
        </span>

      </div>


      ${
        leaders.length
          ? `
            <div class="leaders">

              <div class="leaders-title">
                섹터 거래대금 리더
              </div>

              ${
                leaders
                  .slice(0, 5)
                  .map(stockHTML)
                  .join("")
              }

            </div>
          `
          : ""
      }

    </div>
  `;
}


function sectionHTML(
  title,
  desc,
  sectors
) {

  if (
    !Array.isArray(sectors) ||
    !sectors.length
  ) {
    return "";
  }

  return `
    <section>

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="sector-list">

        ${
          sectors
            .slice(0, 10)
            .map(sectorHTML)
            .join("")
        }

      </div>

    </section>
  `;
}


async function load() {

  const app =
    document.getElementById(
      "app"
    );

  const status =
    document.getElementById(
      "status"
    );

  try {

    const response =
      await fetch(
        API,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "API 응답 오류"
      );
    }


    const current =
      Array.isArray(
        data.currentLeaders
      )
        ? data.currentLeaders
        : [];


    const radar =
      Array.isArray(
        data.nextLeaderRadar
      )
        ? data.nextLeaderRadar
        : [];


    const coverage =
      data.coverage ||
      {};


    const market =
      data.market ||
      {};


    status.innerHTML = `

      <div class="badge ready">
        ● LIVE
      </div>

      <div class="badge">
        기준일 ${data.date || "-"}
      </div>

      <div class="badge">
        ${number(market.stocks).toLocaleString()} 종목
      </div>

    `;


    app.innerHTML = `

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            거래대금 커버리지
          </div>

          <div class="summary-value">
            ${number(
              coverage.tradingValueCoverage
            ).toFixed(1)}%
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            분석 섹터
          </div>

          <div class="summary-value">
            ${number(
              market.sectors
            )}개
          </div>

        </div>

      </div>


      ${sectionHTML(
        "🔥 현재 주도 섹터",
        "HAN",
        current
      )}


      ${sectionHTML(
        "🌱 차기 주도 후보",
        "EARLY",
        radar
      )}

    `;

  } catch (error) {

    app.innerHTML = `
      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${String(
          error?.message ||
          error
        )}

        <br><br>

        /api/sector-scan 상태를 확인해주세요.

      </div>
    `;
  }
}


load();

</script>

</body>
</html>

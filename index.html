<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>LEADER CYCLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07090d;
      --bg2: #0c1425;
      --panel: #11161f;
      --panel2: #171d27;
      --line: #283142;

      --text: #f5f7fa;
      --muted: #8d97a8;

      --red: #ff5b6d;
      --green: #42d98b;
      --blue: #5d8cff;
      --yellow: #ffd166;
      --orange: #ff9f43;
      --purple: #a778ff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(93, 140, 255, .12),
          transparent 35%
        ),
        var(--bg2);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;

      padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 26px;
    }

    .brand {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--blue);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1.6px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .badge.live {
      color: var(--green);
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 24px 0 30px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      font-size: 25px;
      font-weight: 900;
      margin-top: 6px;
    }

    section {
      margin-top: 36px;
      scroll-margin-top: 20px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -.8px;
    }

    .section-desc {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .sector-list,
    .stock-list {
      display: grid;
      gap: 14px;
    }

    .sector-card,
    .stock-card {
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.025),
          transparent
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 17px;
    }

    .sector-top,
    .stock-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .rank {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sector-name,
    .stock-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .stock-code {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .stage {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stage.EARLY {
      color: var(--green);
      background: rgba(66,217,139,.12);
    }

    .stage.LEADERSHIP_ENTRY {
      color: var(--blue);
      background: rgba(93,140,255,.14);
    }

    .stage.EXPANSION {
      color: var(--red);
      background: rgba(255,91,109,.13);
    }

    .stage.PEAK {
      color: var(--yellow);
      background: rgba(255,209,102,.13);
    }

    .stage.EXHAUSTION {
      color: var(--orange);
      background: rgba(255,159,67,.13);
    }

    .stage.EXIT {
      color: #ff4968;
      background: rgba(255,73,104,.13);
    }

    .stage.WATCH {
      color: var(--muted);
      background: rgba(141,151,168,.1);
    }

    .cycle {
      margin-top: 15px;
      padding: 13px;
      border-radius: 14px;
      background: var(--panel2);
    }

    .cycle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .cycle-label {
      font-weight: 850;
      font-size: 13px;
    }

    .cycle-progress {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      margin-top: 10px;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: #0b0f16;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--blue),
          var(--red),
          var(--orange)
        );
    }

    .cycle-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .score-box {
      background: var(--panel2);
      padding: 12px;
      border-radius: 14px;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .score-value {
      margin-top: 4px;
      font-size: 23px;
      font-weight: 900;
    }

    .han {
      color: var(--red);
    }

    .early {
      color: var(--green);
    }

    .exhaust {
      color: var(--orange);
    }

    .metrics {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin-top: 13px;
    }

    .leaders {
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }

    .leaders-title {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .leader-row + .leader-row {
      border-top: 1px solid rgba(255,255,255,.04);
    }

    .leader-name {
      font-size: 14px;
      font-weight: 800;
    }

    .leader-code {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .rate {
      font-size: 14px;
      font-weight: 900;
    }

    .up {
      color: var(--red);
    }

    .down {
      color: var(--blue);
    }

    .entry-score {
      text-align: right;
    }

    .entry-score-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .entry-score-value {
      color: var(--blue);
      font-size: 35px;
      font-weight: 950;
      line-height: 1;
      margin-top: 5px;
    }

    .price-line {
      display: flex;
      gap: 10px;
      align-items: baseline;
      margin-top: 17px;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
    }

    .change {
      font-size: 18px;
      font-weight: 900;
    }

    .alignment {
      margin-top: 14px;
      padding: 13px;
      border-radius: 14px;
      background: var(--panel2);

      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .alignment-title {
      color: var(--muted);
      font-size: 12px;
    }

    .alignment-value {
      font-size: 13px;
      font-weight: 900;
    }

    .alignment-value.PERFECT {
      color: var(--green);
    }

    .alignment-value.BULLISH {
      color: #72e6a8;
    }

    .alignment-value.FORMING {
      color: var(--yellow);
    }

    .alignment-value.MIXED {
      color: var(--orange);
    }

    .alignment-value.BROKEN {
      color: var(--red);
    }

    .stock-score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 13px;
    }

    .stock-score {
      text-align: center;
      background: var(--panel2);
      border-radius: 13px;
      padding: 11px 4px;
    }

    .stock-score span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .stock-score strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .indicator-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 13px;
    }

    .indicator {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel2);
      padding: 11px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .indicator strong {
      color: var(--text);
    }

    .chart-box {
      margin-top: 14px;
      background: #090d13;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 17px;
      padding: 12px;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .chart-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      font-size: 9px;
      font-weight: 900;
    }

    .legend .price-l {
      color: #fff;
    }

    .legend .ma5 {
      color: var(--yellow);
    }

    .legend .ma10 {
      color: var(--blue);
    }

    .legend .ma20 {
      color: var(--green);
    }

    .legend .ma40 {
      color: var(--purple);
    }

    canvas {
      width: 100%;
      height: 190px;
      display: block;
    }

    .chart-dates {
      display: flex;
      justify-content: space-between;
      color: #596579;
      font-size: 10px;
      margin-top: 3px;
    }

    .foot-note {
      color: #647086;
      font-size: 11px;
      margin-top: 13px;
    }

    .loading {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: rgba(255,91,109,.08);
      border: 1px solid rgba(255,91,109,.25);
      border-radius: 16px;
      padding: 16px;
      line-height: 1.7;
    }

    footer {
      color: #566174;
      text-align: center;
      font-size: 10px;
      margin-top: 45px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 31px;
      }

      .sector-name,
      .stock-name {
        font-size: 21px;
      }

      .entry-score-value {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      LEADER CYCLE
    </div>

    <h1>
      시장 주도주 레이더
    </h1>

    <div class="subtitle">
      섹터 사이클과 종목의 진입·주도·초기·소진 구간을 추적합니다.
    </div>

    <div id="status" class="status"></div>
  </header>

  <div class="nav">
    <a href="#leaders">🔥 주도섹터</a>
    <a href="#early">🌱 차기섹터</a>
    <a href="#exhaustion">⚠️ 종료위험</a>
    <a href="#entry">🚀 ENTRY</a>
  </div>

  <div id="app">
    <div class="loading">
      시장 데이터 분석 중...
    </div>
  </div>

  <footer>
    LEADER CYCLE · KRX MARKET DATA
  </footer>

</div>


<script>

const SECTOR_API =
  "/api/sector-scan";

const RANKING_API =
  "/api/rankings";


function num(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}


function formatRate(value) {
  const n = num(value);

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}


function formatPrice(value) {
  return Math.round(
    num(value)
  ).toLocaleString() + "원";
}


function formatMoney(value) {
  const n = num(value);

  if (n >= 1e12) {
    return (
      n / 1e12
    ).toFixed(1) + "조";
  }

  if (n >= 1e8) {
    return (
      n / 1e8
    ).toFixed(0) + "억";
  }

  return Math.round(n)
    .toLocaleString();
}


function rateClass(value) {
  const n = num(value);

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "";
}


function stageInfo(sector) {
  const code =
    sector.stageCode ||
    sector.stage ||
    "WATCH";

  const label =
    sector.stageLabel ||
    {
      EARLY:
        "🌱 초기 포착",

      LEADERSHIP_ENTRY:
        "🚀 주도 진입",

      EXPANSION:
        "🔥 주도 확산",

      PEAK:
        "👑 주도 정점",

      EXHAUSTION:
        "⚠️ 소진 경고",

      EXIT:
        "🔻 주도 이탈",

      WATCH:
        "👀 관찰"
    }[code] ||
    code;

  return {
    code,
    label
  };
}


function leaderHTML(stock) {
  return `
    <div class="leader-row">

      <div>
        <div class="leader-name">
          ${stock.name || "-"}
        </div>

        <div class="leader-code">
          ${stock.code || ""}
          ·
          ${stock.market || ""}
        </div>
      </div>

      <div class="rate ${rateClass(stock.changeRate)}">
        ${formatRate(stock.changeRate)}
      </div>

    </div>
  `;
}


function sectorCardHTML(
  sector,
  index
) {
  const stage =
    stageInfo(sector);

  const leaders =
    Array.isArray(sector.leaders)
      ? sector.leaders
      : [];

  const progress =
    Math.max(
      0,
      Math.min(
        100,
        num(
          sector.cycleProgress
        )
      )
    );

  return `
    <div class="sector-card">

      <div class="sector-top">

        <div>

          <div class="rank">
            #${index + 1}
          </div>

          <div class="sector-name">
            ${sector.name || sector.id || "-"}
          </div>

        </div>

        <div class="stage ${stage.code}">
          ${stage.label}
        </div>

      </div>


      <div class="cycle">

        <div class="cycle-row">

          <div class="cycle-label">
            ${stage.label}
          </div>

          <div class="cycle-progress">
            사이클 ${progress.toFixed(0)}%
          </div>

        </div>

        <div class="progress-track">
          <div
            class="progress-bar"
            style="width:${progress}%"
          ></div>
        </div>

        ${
          sector.stageDescription
            ? `
              <div class="cycle-desc">
                ${sector.stageDescription}
              </div>
            `
            : ""
        }

      </div>


      <div class="score-grid">

        <div class="score-box">

          <div class="score-label">
            HAN
          </div>

          <div class="score-value han">
            ${num(sector.han)}
          </div>

        </div>


        <div class="score-box">

          <div class="score-label">
            EARLY
          </div>

          <div class="score-value early">
            ${num(sector.early)}
          </div>

        </div>


        <div class="score-box">

          <div class="score-label">
            EXHAUST
          </div>

          <div class="score-value exhaust">
            ${num(sector.exhaustion)}
          </div>

        </div>

      </div>


      <div class="metrics">

        <span>
          종목 ${num(sector.stockCount)}개
        </span>

        <span>
          상승비율 ${num(sector.advanceRatio).toFixed(1)}%
        </span>

        <span>
          평균 ${formatRate(sector.averageChangeRate)}
        </span>

        <span>
          거래비중 ${num(sector.tradingShare).toFixed(1)}%
        </span>

      </div>


      ${
        leaders.length
          ? `
            <div class="leaders">

              <div class="leaders-title">
                섹터 거래대금 리더
              </div>

              ${
                leaders
                  .slice(0, 5)
                  .map(leaderHTML)
                  .join("")
              }

            </div>
          `
          : ""
      }

    </div>
  `;
}


function sectorSectionHTML(
  id,
  title,
  desc,
  sectors
) {
  if (
    !Array.isArray(sectors) ||
    !sectors.length
  ) {
    return "";
  }

  return `
    <section id="${id}">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div class="section-desc">
          ${desc}
        </div>

      </div>

      <div class="sector-list">

        ${
          sectors
            .slice(0, 10)
            .map(sectorCardHTML)
            .join("")
        }

      </div>

    </section>
  `;
}


function alignmentInfo(stock) {
  const raw =
    String(
      stock.alignment || ""
    ).toUpperCase();

  if (raw === "PERFECT") {
    return {
      code: "PERFECT",
      label: "🟢 완전 정배열"
    };
  }

  if (raw === "BULLISH") {
    return {
      code: "BULLISH",
      label: "🟢 정배열"
    };
  }

  if (raw === "FORMING") {
    return {
      code: "FORMING",
      label: "🟡 정배열 형성"
    };
  }

  if (raw === "BROKEN") {
    return {
      code: "BROKEN",
      label: "🔴 추세 붕괴"
    };
  }

  return {
    code: "MIXED",
    label: "🟠 혼조"
  };
}


function stockCardHTML(
  stock,
  index
) {
  const scores =
    stock.scores || {};

  const indicators =
    stock.indicators || {};

  const alignment =
    alignmentInfo(stock);

  const chartId =
    `chart-${stock.code}-${index}`;

  return `
    <div class="stock-card">

      <div class="stock-top">

        <div>

          <div class="rank">
            #${stock.rank || index + 1}
          </div>

          <div class="stock-name">
            ${stock.name || "-"}
          </div>

          <div class="stock-code">
            ${stock.code || ""}
            ·
            ${stock.market || ""}
          </div>

        </div>


        <div class="entry-score">

          <div class="entry-score-label">
            ENTRY
          </div>

          <div class="entry-score-value">
            ${num(scores.entry).toFixed(1)}
          </div>

        </div>

      </div>


      <div class="price-line">

        <div class="price">
          ${formatPrice(stock.close)}
        </div>

        <div class="change ${rateClass(stock.changeRate)}">
          ${formatRate(stock.changeRate)}
        </div>

      </div>


      <div class="alignment">

        <div class="alignment-title">
          이동평균 배열
        </div>

        <div class="alignment-value ${alignment.code}">
          ${alignment.label}
        </div>

      </div>


      <div class="stock-score-grid">

        <div class="stock-score">
          <span>ENTRY</span>
          <strong>${num(scores.entry).toFixed(1)}</strong>
        </div>

        <div class="stock-score">
          <span>LEADER</span>
          <strong>${num(scores.leader).toFixed(1)}</strong>
        </div>

        <div class="stock-score">
          <span>EARLY</span>
          <strong>${num(scores.early).toFixed(1)}</strong>
        </div>

        <div class="stock-score">
          <span>EXHAUST</span>
          <strong>${num(scores.exhaustion).toFixed(1)}</strong>
        </div>

      </div>


      <div class="indicator-grid">

        <div class="indicator">
          <span>5일 수익률</span>
          <strong class="${rateClass(indicators.return5)}">
            ${formatRate(indicators.return5)}
          </strong>
        </div>

        <div class="indicator">
          <span>20일 수익률</span>
          <strong class="${rateClass(indicators.return20)}">
            ${formatRate(indicators.return20)}
          </strong>
        </div>

        <div class="indicator">
          <span>MA20 이격</span>
          <strong>
            ${formatRate(indicators.distanceMa20)}
          </strong>
        </div>

        stock.chart.length

                <div class="legend">
                  <span class="price-l">PRICE</span>
                  <span class="ma5">MA5</span>
                  <span class="ma10">MA10</span>

              <canvas

              <div class="chart-dates">

      <div class="foot-note">

  `;
}


function entrySectionHTML(stocks) {
  if (
    !Array.isArray(stocks) ||
    !stocks.length
  ) {
    return "";
  }

  return `
    <section id="entry">

      <div class="section-head">

        <div class="section-title">
          🚀 ENTRY
        </div>

        <div class="section-desc">
          지금 진입 위치가 좋은 공세 시작 후보
        </div>

      </div>

      <div class="stock-list">

        ${
          stocks
            .slice(0, 10)
            .map(stockCardHTML)
            .join("")
        }

      </div>

    </section>
  `;
}


function drawChart(
  canvas,
  rows
) {
  if (
    !canvas ||
    !Array.isArray(rows) ||
    rows.length < 2
  ) {
    return;
  }

  const dpr =
    window.devicePixelRatio || 1;

  const rect =
    canvas.getBoundingClientRect();

  const width =
    Math.max(
      280,
      rect.width
    );

  const height =
    190;

  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(
    dpr,
    dpr
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const padding = {
    left: 7,
    right: 7,
    top: 10,
    bottom: 10
  };

  const keys = [
    "close",
    "ma5",
    "ma10",
    "ma20",
    "ma40"
  ];

  const values = [];

  for (const row of rows) {
    for (const key of keys) {
      const value =
        num(row[key]);

      if (value > 0) {
        values.push(value);
      }
    }
  }

  if (!values.length) {
    return;
  }

  let min =
    Math.min(...values);

  let max =
    Math.max(...values);

  const range =
    Math.max(
      max - min,
      max * .03,
      1
    );

  min -=
    range * .08;

  max +=
    range * .08;

  const plotWidth =
    width -
    padding.left -
    padding.right;

  const plotHeight =
    height -
    padding.top -
    padding.bottom;

  function x(index) {
    return (
      padding.left +
      (
        index /
        Math.max(
          rows.length - 1,
          1
        )
      ) *
      plotWidth
    );
  }

  function y(value) {
    return (
      padding.top +
      (
        1 -
        (
          value - min
        ) /
        (
          max - min
        )
      ) *
      plotHeight
    );
  }

  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i < 5;
    i++
  ) {
    const gy =
      padding.top +
      (
        plotHeight /
        4
      ) *
      i;

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      gy
    );

    ctx.lineTo(
      width -
      padding.right,
      gy
    );

    ctx.stroke();
  }

  function drawLine(
    key,
    color,
    lineWidth
  ) {
    ctx.beginPath();

    let started =
      false;

    rows.forEach(
      (row, index) => {
        const value =
          num(row[key]);

        if (value <= 0) {
          return;
        }

        const px =
          x(index);

        const py =
          y(value);

        if (!started) {
          ctx.moveTo(
            px,
            py
          );

          started = true;

        } else {
          ctx.lineTo(
            px,
            py
          );
        }
      }
    );

    ctx.strokeStyle =
      color;

    ctx.lineWidth =
      lineWidth;

    ctx.lineJoin =
      "round";

    ctx.lineCap =
      "round";

    ctx.stroke();
  }

  drawLine(
    "ma40",
    "#a778ff",
    2
  );

  drawLine(
    "ma20",
    "#42d98b",
    2
  );

  drawLine(
    "ma10",
    "#5d8cff",
    2
  );

  drawLine(
    "ma5",
    "#ffd166",
    2
  );

  drawLine(
    "close",
    "#f5f7fa",
    3
  );

  const last =
    rows[
      rows.length - 1
    ];

  if (
    last &&
    num(last.close) > 0
  ) {
    ctx.beginPath();

    ctx.arc(
      x(
        rows.length - 1
      ),
      y(
        num(last.close)
      ),
      4,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();
  }
}


function drawAllCharts(
  stocks
) {
  if (!Array.isArray(stocks)) {
    return;
  }

  stocks
    .slice(0, 10)
    .forEach(
      (stock, index) => {
        const canvas =
          document.getElementById(
            `chart-${stock.code}-${index}`
          );

        drawChart(
          canvas,
          stock.chart || []
        );
      }
    );
}


function findExhaustionSectors(
  sectorData
) {
  const all =
    Array.isArray(
      sectorData.sectors
    )
      ? sectorData.sectors
      : [];

  return all
    .filter(
      sector => {
        const stage =
          sector.stageCode ||
          sector.stage;

        return (
          stage === "PEAK" ||
          stage === "EXHAUSTION" ||
          stage === "EXIT" ||
          num(
            sector.exhaustion
          ) >= 60
        );
      }
    )
    .sort(
      (a, b) =>
        num(
          b.exhaustion
        ) -
        num(
          a.exhaustion
        )
    )
    .slice(0, 10);
}


async function load() {

  const app =
    document.getElementById(
      "app"
    );

  const status =
    document.getElementById(
      "status"
    );

  try {

    const [
      sectorResponse,
      rankingResponse
    ] =
      await Promise.all([
        fetch(
          SECTOR_API,
          {
            cache: "no-store"
          }
        ),

        fetch(
          RANKING_API,
          {
            cache: "no-store"
          }
        )
      ]);


    if (!sectorResponse.ok) {
      throw new Error(
        `sector-scan HTTP ${sectorResponse.status}`
      );
    }


    if (!rankingResponse.ok) {
      throw new Error(
        `rankings HTTP ${rankingResponse.status}`
      );
    }


    const sectorData =
      await sectorResponse.json();

    const rankingData =
      await rankingResponse.json();


    if (!sectorData.ok) {
      throw new Error(
        sectorData.error ||
        "sector-scan 오류"
      );
    }


    if (!rankingData.ok) {
      throw new Error(
        rankingData.error ||
        "rankings 오류"
      );
    }


    const current =
      Array.isArray(
        sectorData.currentLeaders
      )
        ? sectorData.currentLeaders
        : [];


    const radar =
      Array.isArray(
        sectorData.nextLeaderRadar
      )
        ? sectorData.nextLeaderRadar
        : [];


    const exhaustion =
      findExhaustionSectors(
        sectorData
      );


    const entry =
      Array.isArray(
        rankingData.entryRanking
      )
        ? rankingData.entryRanking
        : [];


    const coverage =
      sectorData.coverage ||
      {};


    const market =
      sectorData.market ||
      {};


    const rankingStats =
      rankingData.stats ||
      {};


    const alignmentStats =
      rankingData.alignmentStats ||
      {};


    status.innerHTML = `

      <div class="badge live">
        ● LIVE
      </div>

      <div class="badge">
        기준일
        ${sectorData.date || rankingData.date || "-"}
      </div>

      <div class="badge">
        ${num(market.stocks).toLocaleString()}
        종목
      </div>

    `;


    app.innerHTML = `

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            거래대금 커버리지
          </div>

          <div class="summary-value">
            ${num(
              coverage.tradingValueCoverage
            ).toFixed(1)}%
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            분석 섹터
          </div>

          <div class="summary-value">
            ${num(
              market.sectors
            )}개
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            종목 분석
          </div>

          <div class="summary-value">
            ${num(
              rankingStats.analyzed
            )}개
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            완전 정배열
          </div>

          <div class="summary-value">
            ${num(
              alignmentStats.PERFECT ??
              alignmentStats.perfect
            )}개
          </div>

        </div>

      </div>


      ${sectorSectionHTML(
        "leaders",
        "🔥 현재 주도 섹터",
        "현재 시장의 중심",
        current
      )}


      ${sectorSectionHTML(
        "early",
        "🌱 차기 주도 후보",
        "주도권 진입 전 후보",
        radar
      )}


      ${sectorSectionHTML(
        "exhaustion",
        "⚠️ 주도 종료 위험",
        "정점·소진·이탈 구간",
        exhaustion
      )}


      ${entrySectionHTML(
        entry
      )}

    `;


    requestAnimationFrame(
      () => {
        drawAllCharts(
          entry
        );
      }
    );


    let resizeTimer;

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          setTimeout(
            () => {
              drawAllCharts(
                entry
              );
            },
            150
          );
      }
    );


  } catch (error) {

    console.error(error);

    app.innerHTML = `

      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${String(
          error?.message ||
          error
        )}

        <br><br>

        sector-scan 또는 rankings API 상태를 확인해주세요.

      </div>

    `;
  }
}


load();

</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leader Cycle | 주도주 사이클 탐지 시스템</title>

<style>
:root{
  --bg:#080b10;
  --card:#10151d;
  --card2:#151b25;
  --border:#252d39;
  --text:#f5f7fa;
  --muted:#8f9baa;
  --green:#35e69a;
  --blue:#4ea1ff;
  --yellow:#ffd166;
  --orange:#ff9f43;
  --red:#ff5c72;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#152032 0%,#080b10 38%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
  "Noto Sans KR",Arial,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 70px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:1px;
}

.logo span{color:var(--green)}

.date{
  color:var(--muted);
  font-size:13px;
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  font-size:32px;
  margin:0 0 10px;
}

.hero p{
  color:var(--muted);
  line-height:1.65;
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:18px;
}

.card{
  background:linear-gradient(145deg,var(--card),#0c1118);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.card-title{
  font-size:13px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:1.4px;
  margin-bottom:18px;
}

.sector{
  display:grid;
  grid-template-columns:32px 1fr 55px 130px;
  gap:12px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #1c2430;
}

.sector:last-child{border-bottom:none}

.rank{
  color:#657181;
  font-weight:700;
}

.name{
  font-weight:750;
}

.score{
  font-weight:850;
  font-size:18px;
}

.badge{
  font-size:11px;
  font-weight:800;
  text-align:center;
  padding:7px 8px;
  border-radius:20px;
}

.acceleration{
  background:#0d392c;
  color:var(--green);
}

.attack{
  background:#102d49;
  color:#62b2ff;
}

.mature{
  background:#3d3013;
  color:var(--yellow);
}

.emerging{
  background:#202d3d;
  color:#8cc8ff;
}

.warning{
  background:#421c23;
  color:#ff7184;
}

.bar{
  height:5px;
  background:#1d2632;
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.fill{
  height:100%;
  border-radius:10px;
  background:linear-gradient(90deg,var(--blue),var(--green));
}

.radar-item{
  margin-bottom:22px;
}

.radar-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
}

.radar-name{
  font-weight:750;
}

.radar-score{
  color:var(--green);
  font-weight:800;
}

.signal{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.signal span{
  background:#18212d;
  color:#9facbb;
  border-radius:7px;
  padding:5px 7px;
  font-size:10px;
}

.section{
  margin-top:18px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.metric{
  background:var(--card2);
  padding:15px;
  border-radius:13px;
  border:1px solid #222b37;
}

.metric-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
}

.metric-value{
  font-size:18px;
  font-weight:800;
}

.up{color:var(--green)}
.down{color:var(--red)}
.yellow{color:var(--yellow)}
